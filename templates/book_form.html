{% extends 'base.html' %}
{% block title %}{{ action }}{% endblock %}
{% block content %}
    <h2>{{ action }}</h2>
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
